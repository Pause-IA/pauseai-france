name: Plan du site

# Vérifie que docs/plan-du-site.md et src/lib/data/plan-du-site.json sont à
# jour. Ils sont régénérés par le hook pre-commit (.husky/pre-commit) : ce
# contrôle ne rattrape que les commits faits sans le hook (édition depuis
# l'interface GitHub, --no-verify).
#
# Pas de commit automatique : main est protégée (PR obligatoire), un push du
# workflow y est refusé. En cas d'échec : `pnpm run plan-du-site`, puis
# commiter les deux fichiers.

on:
  pull_request:
    paths:
      - 'src/routes/**'
      - 'src/posts/**'
      - 'src/lib/components/Header.svelte'
      - 'src/lib/components/Footer.svelte'
      - 'src/lib/i18n/**'
      - 'scripts/plan-du-site.mjs'
      - 'docs/plan-du-site.md'
      - 'src/lib/data/plan-du-site.json'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  plan-du-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      # Le script n'utilise que les modules intégrés de Node : pas d'install.
      - name: Régénérer le plan du site
        run: node scripts/plan-du-site.mjs

      - name: Vérifier qu'il est à jour
        run: |
          # La ligne « Dernière génération : <date> » change chaque jour : ignorée.
          if git diff --quiet -I 'Dernière génération' -I '"genere"' -- docs/plan-du-site.md src/lib/data/plan-du-site.json; then
            echo "✓ Plan du site à jour."
            exit 0
          fi
          git diff --stat -- docs/plan-du-site.md src/lib/data/plan-du-site.json
          echo "::error::Plan du site pas à jour : lancer \`pnpm run plan-du-site\` et commiter docs/plan-du-site.md et src/lib/data/plan-du-site.json."
          exit 1
